<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book — Page &amp; Pause</title>
  <meta name="description" content="Read the blurb and grab the free summary.">
  <meta name="theme-color" content="#FBF6EE">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Set the theme before first paint so there is no light/dark flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('pp-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#bookDetail">Skip to the book</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">Page &amp; Pause</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html#books">Books</a>
        <a href="index.html#how">How it works</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to evening (dark) mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="detail-page">
    <!-- The book is rendered here by script.js using ?id=... in the URL -->
    <div class="wrap" id="bookDetail">
      <p class="result-count">Loading the book…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="disclosure">Some links lead to sponsored offers. I may earn a commission.</p>
      <p class="privacy">This page doesn't collect personal data. Your light/dark preference is stored only in your browser.</p>
      <p class="copyright">© <span id="year">2026</span> Page &amp; Pause. Made slowly, on purpose.</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
